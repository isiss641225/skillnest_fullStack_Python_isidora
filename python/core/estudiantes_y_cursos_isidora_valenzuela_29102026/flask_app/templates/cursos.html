<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursos</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('cursos') }}">Estudiantes y Cursos</a>
        </div>
    </nav>

    <main class="container py-3">
        <div class="row g-4">
            <!-- Formulario Nuevo Curso -->
            <div class="col-lg-5">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h1 class="h3 mb-4">Nuevo Curso</h1>
                        <form action="{{ url_for('crear_curso') }}" method="POST">
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre:</label>
                                <input type="text" id="nombre" name="nombre" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-success">Crear</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Lista de Todos los Cursos -->
            <div class="col-lg-7">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h2 class="h3 mb-4">Todos los Cursos</h2>
                        {% if cursos %}
                            <div class="list-group">
                                {% for curso in cursos %}
                                    <a href="{{ url_for('mostrar_curso', id=curso.id) }}" class="list-group-item list-group-item-action">
                                        {{ curso.nombre }}
                                    </a>
                                {% endfor %}
                            </div>
                        {% else %}
                            <div class="alert alert-info">
                                No existen cursos registrados.
                            </div>
                        {% endif %}

                        <div class="mt-4">
                            <a href="{{ url_for('nuevo_estudiante') }}" class="btn btn-primary">Agregar Estudiante</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Script de Bootstrap 5 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
