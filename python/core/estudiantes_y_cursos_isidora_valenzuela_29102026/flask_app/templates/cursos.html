{% extends "base.html" %}
{% block title %}Cursos{% endblock %}
{% block content %}
<div class="row">
    <div class="col-md-5">
        <h2>Nuevo Curso</h2>
        <form action="{{ url_for('crear_curso') }}" method="POST">
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre:</label>
                <input type="text" id="nombre" name="nombre" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary">Crear</button>
        </form>
    </div>
    <div class="col-md-7">
        <h2>Todos los Cursos</h2>
        <ul class="list-group mb-3">
            {% for curso in cursos %}
                <li class="list-group-item">
                    <a href="{{ url_for('mostrar_curso', id=curso.id) }}">{{ curso.nombre }}</a>
                </li>
            {% endfor %}
        </ul>
        <a href="{{ url_for('nuevo_estudiante') }}" class="btn btn-link">Agregar Estudiante</a>
    </div>
</div>
{% endblock %}
