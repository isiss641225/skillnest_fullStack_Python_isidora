{% extends "base.html" %}
{% block title %}Nuevo Estudiante{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2>Nuevo Estudiante</h2>
        <form action="{{ url_for('crear_estudiante') }}" method="POST">
            <div class="mb-3">
                <label for="curso_id" class="form-label">Curso:</label>
                <select id="curso_id" name="curso_id" class="form-select" required>
                    {% for curso in cursos %}
                        <option value="{{ curso.id }}">{{ curso.nombre }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre:</label>
                <input type="text" id="nombre" name="nombre" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="apellido" class="form-label">Apellido:</label>
                <input type="text" id="apellido" name="apellido" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="edad" class="form-label">Edad:</label>
                <input type="number" id="edad" name="edad" class="form-control" min="1" required>
            </div>
            <button type="submit" class="btn btn-primary">Crear</button>
            <a href="{{ url_for('cursos') }}" class="btn btn-link">Inicio</a>
        </form>
    </div>
</div>
{% endblock %}
