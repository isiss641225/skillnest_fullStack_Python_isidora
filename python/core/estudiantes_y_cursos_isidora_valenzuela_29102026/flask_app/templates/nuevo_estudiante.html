<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Estudiante</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('cursos') }}">Estudiantes y Cursos</a>
        </div>
    </nav>

    <main class="container py-3">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h1 class="h3 mb-4">Nuevo Estudiante</h1>
                        <form action="{{ url_for('crear_estudiante') }}" method="POST">
                            
                            <!-- Desplegable de Curso -->
                            <div class="mb-3">
                                <label for="curso_id" class="form-label">Curso:</label>
                                <select id="curso_id" name="curso_id" class="form-select" required>
                                    <option value="" disabled selected>Selecciona un curso</option>
                                    {% for curso in cursos %}
                                        <option value="{{ curso.id }}">{{ curso.nombre }}</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <!-- Nombre -->
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre:</label>
                                <input type="text" id="nombre" name="nombre" class="form-control" required>
                            </div>

                            <!-- Apellido -->
                            <div class="mb-3">
                                <label for="apellido" class="form-label">Apellido:</label>
                                <input type="text" id="apellido" name="apellido" class="form-control" required>
                            </div>

                            <!-- Edad -->
                            <div class="mb-4">
                                <label for="edad" class="form-label">Edad:</label>
                                <input type="number" id="edad" name="edad" class="form-control" min="1" required>
                            </div>

                            <button type="submit" class="btn btn-success">Crear</button>
                            <a href="{{ url_for('cursos') }}" class="btn btn-outline-secondary ms-2">Inicio</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Script de Bootstrap 5 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
