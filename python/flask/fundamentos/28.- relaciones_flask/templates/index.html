<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Taco</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Crear Taco</h1>
        <div>
            <a href="{{ url_for('restaurantes') }}" class="btn btn-outline-secondary">Ver Restaurantes</a>
            <a href="{{ url_for('complementos') }}" class="btn btn-outline-info">Gestionar Complementos</a>
        </div>
    </div>

    <div class="card p-4 shadow-sm max-w-600 mx-auto">
        <form action="{{ url_for('crear') }}" method="POST">
            <div class="mb-3">
                <label for="tortilla" class="form-label">Tortilla</label>
                <input type="text" id="tortilla" name="tortilla" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="guiso" class="form-label">Guiso</label>
                <input type="text" id="guiso" name="guiso" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="salsa" class="form-label">Salsa</label>
                <input type="text" id="salsa" name="salsa" class="form-control" required>
            </div>
            <div class="mb-4">
                <label for="restaurante_id" class="form-label">Restaurante</label>
                <select id="restaurante_id" name="restaurante_id" class="form-select" required>
                    <option value="">Selecciona un restaurante</option>
                    {% for restaurante in todos_restaurantes %}
                        <option value="{{ restaurante.id }}">{{ restaurante.nombre }}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="btn btn-primary w-100">Crear Taco</button>
        </form>
    </div>
</div>
</body>
</html>
