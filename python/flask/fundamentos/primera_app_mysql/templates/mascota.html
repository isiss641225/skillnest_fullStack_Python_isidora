<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>{{ mascota.nombre }}</title>
</head>
<body>
    <div class="card" style="max-width: 400px; margin: 2rem auto;">
        <h1>{{ mascota.nombre }} 🐾</h1>
        <p><b>ID:</b> {{ mascota.id }}</p>
        <p><b>Tipo:</b> {{ mascota.tipo }}</p>
        <p><b>Color:</b> {{ mascota.color }}</p>
        <p><b>Creado:</b> {{ mascota.created_at }}</p>
        <p><b>Actualizado:</b> {{ mascota.updated_at }}</p>
        <br>
        <a href="{{ url_for('index') }}">← Volver al listado</a>
    </div>
</body>
</html>
