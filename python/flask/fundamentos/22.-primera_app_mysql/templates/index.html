<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Enlace a la hoja de estilos externa -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>Mascotas</title>
</head>

<body>

    <!-- 1. TÍTULO PRINCIPAL -->
    <h1 class="main-title">Listado de Mascotas</h1>

    <!-- 2. GRILLA DE TARJETAS EN FILAS Y COLUMNAS -->
    <div class="cards-grid">
        {% if mascotas %}
            {% for mascota in mascotas %}
                <div class="pet-card">
                    <h3>{{ mascota.nombre }} 🐾</h3>
                    <p><strong>Tipo:</strong> {{ mascota.tipo }}</p>
                    <p><strong>Color:</strong> {{ mascota.color }}</p>
                    <a href="{{ url_for('mostrar_mascota', id=mascota.id) }}">Ver detalles →</a>
                </div>
            {% endfor %}
        {% else %}
            <p>No existen mascotas registradas.</p>
        {% endif %}
    </div>

    <!-- 3. FORMULARIO ABAJO Y CENTRADO -->
    <div class="footer-container">
        <div class="form-card">
            <h2>Agregar una mascota</h2>
            <form action="/crear_mascota" method="POST">
                <label>Nombre:</label>
                <input type="text" name="nombre" required>

                <label>Tipo:</label>
                <input type="text" name="tipo" required>

                <label>Color:</label>
                <input type="text" name="color" required>

                <input type="submit" value="Agregar Mascota">
            </form>
        </div>
    </div>

</body>

</html>
